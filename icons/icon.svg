<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#022C43"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#cyanGrad)" stroke-width="6" opacity="0.35"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.25" filter="url(#glow)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10B981" stroke-width="1" opacity="0.15" />

  <!-- Bento Grid Graphic Symbol (Medical Bento AI) -->
  <g transform="translate(116, 116)">
    <!-- Top-Left Main Large Tile -->
    <rect x="0" y="0" width="165" height="135" rx="20" fill="rgba(0, 229, 255, 0.12)" stroke="url(#cyanGrad)" stroke-width="4"/>
    <!-- Heartbeat Line in Top-Left -->
    <path d="M 25 70 L 55 70 L 70 35 L 88 105 L 105 50 L 120 70 L 140 70" fill="none" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Top-Right Accent Tile -->
    <rect x="180" y="0" width="100" height="135" rx="20" fill="rgba(16, 185, 129, 0.12)" stroke="url(#emeraldGrad)" stroke-width="3.5"/>
    <!-- Upward Trend Arrow -->
    <path d="M 205 95 L 245 45 M 245 45 L 222 45 M 245 45 L 245 68" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Bottom-Left Stat Tile -->
    <rect x="0" y="150" width="100" height="130" rx="20" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="3" opacity="0.9"/>
    <circle cx="50" cy="215" r="22" fill="none" stroke="#F59E0B" stroke-width="4"/>
    <path d="M 50 200 L 50 215 L 62 215" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Bottom-Right Wide Chart Tile -->
    <rect x="115" y="150" width="165" height="130" rx="20" fill="rgba(0, 229, 255, 0.1)" stroke="url(#cyanGrad)" stroke-width="4"/>
    <!-- KM Survival Stepped Curve -->
    <path d="M 135 180 L 165 180 L 165 200 L 205 200 L 205 225 L 235 225 L 235 250 L 260 250" fill="none" stroke="#00E5FF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="135" cy="180" r="4.5" fill="#00E5FF"/>
    <circle cx="260" cy="250" r="4.5" fill="#00E5FF"/>
  </g>

  <!-- Cross/DNA Sparkle in Center -->
  <circle cx="231" cy="251" r="5" fill="#FFFFFF" filter="url(#glow)"/>
</svg>
